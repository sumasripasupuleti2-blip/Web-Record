
<!DOCTYPE html>
<html>
<head>
    <title>Containers and Classes</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .container {
            width: 85%;
            margin: 30px auto;
            padding: 20px;
            background: white;
        }

        .header {
            background: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .section {
            background: #e5f0ff;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
        }

        .footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>My Website</h1>
    </div>

    <div class="section">
        <h2>About</h2>
        <p>Welcome to my website.</p>
    </div>

    <div class="section">
        <h2>Services</h2>
        <p>Web Design and Development.</p>
    </div>

    <div class="section">
        <h2>Contact</h2>
        <p>Email: student@example.com</p>
    </div>

    <div class="footer">
        <p>Thank You for Visiting</p>
    </div>

</div>

</body>
</html>
