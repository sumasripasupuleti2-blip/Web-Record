
<!DOCTYPE html>
<html>
<head>
    <title>Borders Padding and Background Images</title>

    <style>
        body {
            font-family: Arial;
            background-image: url("https://picsum.photos/1200/800");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        .container {
            width: 60%;
            margin: 100px auto;
            padding: 40px;
            background-color: rgba(255,255,255,0.9);
            border: 5px solid navy;
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            color: navy;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Beautiful Nature</h1>

        <p>
            Background images make websites
            more attractive.
        </p>

    </div>

</body>
</html>
