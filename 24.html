
<!DOCTYPE html>
<html>
<head>
    <title>Tailwind CSS Website</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

    <header class="bg-blue-800 text-white text-center p-6">

        <h1 class="text-3xl font-bold">
            Online Learning Platform
        </h1>

        <p class="mt-2">
            Learn New Skills Online
        </p>

    </header>

    <nav class="bg-blue-950 text-white p-4 text-center">

        <a href="#" class="mx-3">Home</a>

        <a href="#" class="mx-3">Courses</a>

        <a href="#" class="mx-3">About</a>

        <a href="#" class="mx-3">Contact</a>

    </nav>

    <main class="max-w-5xl mx-auto p-6">

        <h2 class="text-2xl font-bold text-center mb-6">
            Our Courses
        </h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">

            <div class="bg-white p-6 rounded-lg shadow">

                <h3 class="text-xl font-bold text-blue-700">
                    HTML
                </h3>

                <p class="mt-2">
                    Learn webpage structure.
                </p>

            </div>

            <div class="bg-white p-6 rounded-lg shadow">

                <h3 class="text-xl font-bold text-blue-700">
                    CSS
                </h3>

                <p class="mt-2">
                    Learn webpage styling.
                </p>

            </div>

            <div class="bg-white p-6 rounded-lg shadow">

                <h3 class="text-xl font-bold text-blue-700">
                    JavaScript
                </h3>

                <p class="mt-2">
                    Learn webpage interaction.
                </p>

            </div>

        </div>

    </main>

    <footer class="bg-blue-800 text-white text-center p-4">

        <p>Online Learning Platform</p>

    </footer>

</body>
</html>
