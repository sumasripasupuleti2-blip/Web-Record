
<!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks and Navigation</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        nav {
            background: navy;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px;
        }

        nav a:hover {
            background: royalblue;
        }

        section {
            padding: 40px;
            min-height: 150px;
        }

        #home {
            background: #e6f0ff;
        }

        #about {
            background: #f0fff0;
        }

        #contact {
            background: #fff0e6;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="https://www.google.com" target="_blank">
            Google
        </a>
    </nav>

    <section id="home">
        <h1>Home Page</h1>
        <p>Welcome to my website.</p>
    </section>

    <section id="about">
        <h1>About Us</h1>
        <p>This website demonstrates HTML hyperlinks.</p>
    </section>

    <section id="contact">
        <h1>Contact Us</h1>
        <p>Email: student@example.com</p>
    </section>

</body>
</html>
