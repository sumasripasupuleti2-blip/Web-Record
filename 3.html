
<!DOCTYPE html>
<html>
<head>
    <title>My First Frontend Project</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f6fa;
        }

        header {
            background: #243b80;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #172554;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .content {
            padding: 30px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 15px auto;
            width: 60%;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        button {
            background: #243b80;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
        }

        footer {
            background: #243b80;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>My First Website</h1>
    <p>Welcome to Frontend Development</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
</nav>

<div class="content" id="home">

    <div class="card">

        <h2>Welcome</h2>

        <p>
            This is my first frontend project
            using HTML and CSS.
        </p>

        <button>Get Started</button>

    </div>

    <div class="card" id="about">

        <h2>About Us</h2>

        <p>We are learning website development.</p>

    </div>

    <div class="card" id="services">

        <h2>Our Services</h2>

        <p>Web Design | Frontend Development</p>

    </div>

</div>

<footer>
    <p>My First Frontend Project</p>
</footer>

</body>
</html>
