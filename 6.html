
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: navy;
        }

        .box {
            width: 250px;
            background: lightblue;
            padding: 30px;
            border: 8px solid blue;
            margin: 50px auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        <h2>Content</h2>
        <p>This is the content area.</p>
    </div>

</body>
</html>
