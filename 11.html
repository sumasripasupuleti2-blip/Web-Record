
<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML5 Webpage</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        header, footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        main {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        section {
            flex: 3;
            background: white;
            padding: 20px;
        }

        article {
            background: #e6f0ff;
            padding: 15px;
        }

        aside {
            flex: 1;
            background: #ddd;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Information Portal</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Courses</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <section>

            <h2>Latest News</h2>

            <article>
                <h3>Web Development Workshop</h3>
                <p>
                    A workshop on HTML and CSS
                    will be conducted for students.
                </p>
            </article>

        </section>

        <aside>
            <h2>Announcements</h2>
            <p>New courses available.</p>
        </aside>

    </main>

    <footer>
        <p>Copyright 2026 Student Portal</p>
    </footer>

</body>
</html>
