
<!DOCTYPE html>
<html>
<head>
    <title>CSS Text and Background Styling</title>

    <style>
        body {
            background-color: #eaf2ff;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
            text-align: center;
            text-transform: uppercase;
        }

        h2 {
            color: darkred;
            text-decoration: underline;
        }

        p {
            color: #333333;
            font-size: 18px;
            font-style: italic;
            line-height: 1.6;
        }

        .box {
            background-color: lightyellow;
            padding: 20px;
            text-align: center;
            border: 2px solid orange;
        }

        .highlight {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS Styling Demonstration</h1>

    <h2>Text Formatting</h2>

    <p>
        CSS is used to style and design
        attractive web pages.
    </p>

    <div class="box">

        <h2>Background Styling</h2>

        <p class="highlight">
            This text demonstrates CSS colors and fonts.
        </p>

    </div>

</body>
</html>
