
<!DOCTYPE html>
<html>
<head>
    <title>Lists and Images</title>

    <style>
        body {
            font-family: Arial;
            background: #f0f8ff;
            margin: 30px;
        }

        h1 {
            color: navy;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        img {
            width: 300px;
            height: 180px;
            border: 3px solid navy;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Favourite Places</h1>

        <h2>Unordered List</h2>

        <ul>
            <li>Manali</li>
            <li>Kashmir</li>
            <li>Goa</li>
            <li>Ooty</li>
        </ul>

        <h2>Ordered List</h2>

        <ol>
            <li>Visit the place</li>
            <li>Take photographs</li>
            <li>Enjoy the trip</li>
        </ol>

        <h2>Sample Image</h2>

        <img src="https://picsum.photos/600/360"
             alt="Beautiful scenery">

    </div>

</body>
</html>
